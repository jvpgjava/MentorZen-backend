spring.application.name=mentor-redacao-zen
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:mentor-redacao-zen}
jwt.expire-duration=${JWT_EXPIRE_DURATION:7d}

# Google AI
google.ai.api-key=${GOOGLE_AI_API_KEY:apikey}
google.ai.project-id=${GOOGLE_AI_PROJECT_ID:apikey}
app.gemini.max-requests-per-minute=${GEMINI_MAX_REQUESTS:60}
app.gemini.fallback-to-mock=${GEMINI_FALLBACK_TO_MOCK:true}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Frontend
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Email Config
